[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-ledger"
version = "0.1.0"
description = "Offline canonical CSV spending reports"
requires-python = ">=3.10"

[project.scripts]
receipt-ledger = "ledger:main"

[tool.setuptools]
py-modules = ["ledger"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
check_untyped_defs = true
